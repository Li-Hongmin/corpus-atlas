[project]
name = "corpus-atlas"
version = "0.2.0"
description = "Local-first, traceable investigation workspaces"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Li Hongmin"}]
dependencies = []

[project.scripts]
corpus-atlas = "corpus_atlas.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/corpus_atlas"]
